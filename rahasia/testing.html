<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Simple PostMessage Listener</title></head>
<body>
  <button onclick="window.open('https://accounts.zomato.com/consent?consent_challenge=54366')">
    Buka popup
  </button>

  <script>
    window.addEventListener("message", function (event) {
      console.log("origin:", event.origin, "data:", event.data);
    });
  </script>
</body>
</html>
