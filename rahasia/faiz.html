<!DOCTYPE html>
<html>
<body>

<button onclick="openLogin()">Open Login</button>

<script>
function openLogin() {
    const loginChallenge = "TEST-12345";

    window.open(
        "https://example.com/login?login_challenge=" +
        encodeURIComponent(loginChallenge),
        "loginWindow",
        "width=500,height=700"
    );
}

window.addEventListener("message", function (event) {
    console.log("Message received:");
    console.log("origin:", event.origin);
    console.log("data:", event.data);

    if (event.data?.ev === "setLoginChallenge") {
        console.log("login_challenge:", event.data.lc);
    }
});
</script>

</body>
</html>
