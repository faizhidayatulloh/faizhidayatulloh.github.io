<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<script>
		const xhr = new XMLHttpRequest();
		xhr.onload = ambil;
		xhr.open('get','http://192.168.1.12:3000/api/profile');
		xhr.send();
		function ambil() {
			const jason = this.responseText;
			const hasil = JSON.parse(jason);
			console.log(hasil);
		}
	</script>
</body>
</html>
